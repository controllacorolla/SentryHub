<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{--bg:#0a0c0f;--p2:#161b24;--line:#2a313a;--line2:#39414c;--txt:#eef1f4;--txt2:#99a2ad;--txt3:#5c6670;--acc:#a492da}
  *{margin:0;box-sizing:border-box}
  body{background:#000;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;padding:30px;display:flex;justify-content:center}
  .sheet{width:1040px;background:var(--bg);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
  .head{padding:18px 30px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:4px;color:var(--txt3)}
  .cell{padding:40px 30px;display:flex;align-items:center;gap:60px;justify-content:center;border-bottom:1px solid var(--line)}
  .cell:last-child{border-bottom:0}
  .tile{width:84px;height:84px;border-radius:19px;background:var(--p2);border:1px solid var(--line2);box-shadow:0 7px 18px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .wm{color:var(--txt);font-size:30px;letter-spacing:8px}
  .cap{font-size:11px;color:var(--txt3);letter-spacing:1px;line-height:1.6;max-width:260px}
  .cap b{color:var(--acc);font-weight:400}
  svg{display:block}
</style></head><body>
<div class="sheet">
  <div class="head">PALISADE · MARK — PLANE + SIGNAL + WALL</div>
  <div class="cell">
    <svg width="118" height="100" viewBox="0 0 114 96"><g fill="var(--txt2)"><rect x="4" y="66" width="8" height="28"/><rect x="16" y="54" width="8" height="40"/><rect x="28" y="42" width="8" height="52"/><rect x="40" y="30" width="8" height="64"/></g><polygon points="52,26 64,26 58,6" fill="var(--acc)"/><rect x="52" y="26" width="12" height="68" fill="var(--acc)"/><g fill="var(--txt2)"><rect x="68" y="30" width="8" height="64"/><rect x="80" y="42" width="8" height="52"/><rect x="92" y="54" width="8" height="40"/><rect x="104" y="66" width="8" height="28"/></g></svg>
    <div class="tile"><svg width="52" height="44" viewBox="0 0 114 96"><g fill="var(--txt2)"><rect x="4" y="66" width="8" height="28"/><rect x="16" y="54" width="8" height="40"/><rect x="28" y="42" width="8" height="52"/><rect x="40" y="30" width="8" height="64"/></g><polygon points="52,26 64,26 58,6" fill="var(--acc)"/><rect x="52" y="26" width="12" height="68" fill="var(--acc)"/><g fill="var(--txt2)"><rect x="68" y="30" width="8" height="64"/><rect x="80" y="42" width="8" height="52"/><rect x="92" y="54" width="8" height="40"/><rect x="104" y="66" width="8" height="28"/></g></svg></div>
    <div class="cap"><b>Plane</b> — the pointed violet spire (nose rising).<br><b>Signal</b> — the whole shape is a spectrum peak.<br><b>Wall</b> — vertical bars = a palisade.</div>
  </div>
  <div class="cell">
    <div style="display:flex;align-items:center;gap:18px">
      <svg width="52" height="44" viewBox="0 0 114 96"><g fill="var(--txt2)"><rect x="4" y="66" width="8" height="28"/><rect x="16" y="54" width="8" height="40"/><rect x="28" y="42" width="8" height="52"/><rect x="40" y="30" width="8" height="64"/></g><polygon points="52,26 64,26 58,6" fill="var(--acc)"/><rect x="52" y="26" width="12" height="68" fill="var(--acc)"/><g fill="var(--txt2)"><rect x="68" y="30" width="8" height="64"/><rect x="80" y="42" width="8" height="52"/><rect x="92" y="54" width="8" height="40"/><rect x="104" y="66" width="8" height="28"/></g></svg>
      <span class="wm">PALISADE</span>
    </div>
  </div>
</div>
</body></html>
